[package]
name = "jlu-dela-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "JLU Dela campus workbench API foundation"
license = "GPL-3.0-or-later"
publish = false

[features]
integration = []

[dependencies]
anyhow = "1.0"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
  "migrate",
  "macros",
] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"

[dev-dependencies]
serde_json = "1.0"

[profile.release]
strip = true
lto = "thin"