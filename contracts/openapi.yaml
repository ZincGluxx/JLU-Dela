openapi: 3.0.3

info:
  title: JLU Dela HTTP API
  version: 0.1.0
  description: |
    Single source of truth for the HTTP endpoints currently implemented by the
    JLU Dela foundation service (planning item A01).

    Implemented endpoints:
    - GET /health/live
    - GET /health/ready
    - GET /api/v1/meta
    - POST /api/v1/auth/refresh
    - POST /api/v1/auth/logout
    - GET /api/v1/me
    - POST /api/v1/sync-jobs
    - GET /api/v1/sync-jobs/{id}

    Sync jobs persist a source synchronization request. This build registers no
    source adapter, so creating a job returns 422 UNSUPPORTED_SOURCE until B/C/D
    register a verified source. A job never reports success before its adapter
    succeeds.

    The session endpoints operate on an opaque token pair. Activation and login
    are not part of this contract yet: the workbench identity scheme still needs
    human approval, so no client may assume invitation accounts or school SSO.
    Campuses, sync jobs, courses, assignments, notices, materials, todos and
    calendar remain planning proposals and are not available.

    Protocol conventions:
    - JSON field names use snake_case.
    - Resource identifiers are strings, including identifiers owned by campus
      sources.
    - Timestamps are UTC RFC 3339 strings with a `Z` suffix. Calendar dates use
      `YYYY-MM-DD`. The campus display timezone is `Asia/Shanghai`.
    - A successful single-object response is
      `{"data": {...}, "meta": {"request_id": "..."}}`.
    - A successful list response puts the array in `data` and adds
      `next_cursor` and `has_more` to `meta`. `next_cursor` is an opaque
      string or null. The default page size is 50 and the maximum is 100.
    - Clients may send `X-Request-Id`; otherwise the server generates one. The
      value is echoed in the response header and in `meta.request_id` or
      `error.request_id`, and it is the same identifier used in logs.
    - Errors always use
      `{"error": {"code": "...", "message": "...", "request_id": "...", "retryable": false, "fields": []}}`.
      `fields` contains `{"path": "...", "code": "..."}` objects for validation
      errors. Clients must render unknown error codes safely.
    - A nullable field is always present and may be null. An optional field may
      be omitted. In PATCH requests, an omitted field keeps its current value;
      explicit null clears a field only when the schema marks it nullable.
    - Unknown write fields are rejected with 422. Clients ignore unknown response
      fields.
    - 401 means the workbench identity is invalid. Its codes are `AUTH_REQUIRED`,
      `INVALID_TOKEN`, `TOKEN_EXPIRED` and `SESSION_REVOKED`. A campus source
      failure is never a 401 and must not log the user out of the workbench.
      403 means the identity may not perform the operation. Missing and
      invisible private objects both use 404. 409 is a write or idempotency
      conflict, 422 a validation failure, 429 includes `Retry-After`, and 503
      means the service is temporarily unable to serve the request.
  contact:
    name: JLU Dela contributors
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0-or-later.html

security: []

servers:
  - url: http://127.0.0.1:8080
    description: Local development. Clients must override this address at build or runtime.

tags:
  - name: Health
    description: Process liveness and dependency readiness probes.
  - name: Meta
    description: Public build and contract identity.
  - name: Auth
    description: Workbench session lifecycle. Campus source authorization is separate.
  - name: Me
    description: The authenticated workbench user.
  - name: Sync
    description: Persisted source synchronization jobs. Source adapters are owned by B/C/D.

x-contract-status:
  implemented:
    - GET /health/live
    - GET /health/ready
    - GET /api/v1/meta
    - POST /api/v1/auth/refresh
    - POST /api/v1/auth/logout
    - GET /api/v1/me
    - POST /api/v1/sync-jobs
    - GET /api/v1/sync-jobs/{id}
  design-only:
    note: Activation and login, connections and all business endpoints are not exposed by the service and must not be treated as available. Sync jobs exist, but no source adapter is registered in this build.

paths:
  /health/live:
    get:
      operationId: getHealthLive
      tags:
        - Health
      summary: Report process liveness
      description: Returns success while the HTTP process can serve requests. This check does not touch PostgreSQL.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /health/ready:
    get:
      operationId: getHealthReady
      tags:
        - Health
      summary: Report database readiness
      description: Checks that PostgreSQL is reachable and that the service metadata migration has been applied.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: PostgreSQL is reachable and the schema is ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                data:
                  status: ready
                  schema_version: '1'
                meta:
                  request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
        '503':
          description: PostgreSQL is unavailable or the schema has not been migrated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: DATABASE_UNAVAILABLE
                  message: Database is unavailable.
                  request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
                  retryable: true
                  fields: []
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/meta:
    get:
      operationId: getMeta
      tags:
        - Meta
      summary: Return public service identity
      description: Returns the service version, API version and the build identifier supplied by the deployment. It does not expose configuration or credentials.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Public service identity.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
              example:
                data:
                  service: jlu-dela-api
                  version: 0.1.0
                  api_version: v1
                  build_id: 6a3c413
                meta:
                  request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - Auth
      summary: Rotate the session token pair
      description: |
        Exchanges a current refresh token for a new access and refresh token.
        Both tokens rotate on every call. A token that was already rotated,
        revoked or expired is rejected, and the client must return to the
        workbench login entry point. This endpoint is not used to reconnect a
        campus source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A fresh token pair.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/ClientError'
        '422':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/logout:
    post:
      operationId: logoutSession
      tags:
        - Auth
      summary: Revoke the current session
      description: |
        Revokes the session identified by the bearer token. The refresh token in
        the body must belong to the same session. After this call both tokens are
        invalid, other sessions of the same user stay usable, and campus source
        credentials are not affected unless their owner revokes them separately.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: The session is revoked. The response has no body.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/ClientError'
        '422':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/me:
    get:
      operationId: getMe
      tags:
        - Me
      summary: Return the authenticated workbench user
      description: |
        The user id always comes from the session on the server. Clients must not
        send or choose a user id. The response contains no campus source session
        or credential.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current workbench user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                data:
                  id: 0b6a4f8e-6f0e-4a5c-9b6d-2f4a7c1d8e30
                  display_name: 示例用户
                  timezone: Asia/Shanghai
                meta:
                  request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/sync-jobs:
    post:
      operationId: createSyncJob
      tags:
        - Sync
      summary: Queue a source synchronization
      description: |
        Persists a sync job and returns 202 before any source work starts.
        Repeating the same user, source, resource and canonical scope while a job
        is queued or running returns that job with `reused: true`; it does not
        replay work or create a second job. A queued or running job is executed
        by one worker. An interrupted process is recovered after its lease
        expires; after three attempts the job fails with `SYNC_INTERRUPTED`.
        No source adapter is registered in this build, so every source currently
        returns 422 UNSUPPORTED_SOURCE.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSyncJobRequest'
      responses:
        '202':
          description: The job is persisted. It may be the existing active job.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobAcceptedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/ClientError'
        '422':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/sync-jobs/{id}:
    get:
      operationId: getSyncJob
      tags:
        - Sync
      summary: Read a sync job owned by the current user
      description: |
        Returns the persisted job. Jobs of other users, unknown ids and invalid
        ids all return 404 SYNC_JOB_NOT_FOUND. The response never contains source
        payloads, credentials or upstream error text.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque sync job id.
          schema:
            type: string
      responses:
        '200':
          description: The sync job.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Opaque access token from the workbench session, sent as
        `Authorization: Bearer <access_token>`. Access tokens expire after 15
        minutes and rotate together with the refresh token. Clients must store
        tokens in the platform secure storage and never log them.

  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client request identifier. The server echoes it in the response header and body.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  headers:
    XRequestId:
      description: Request identifier used by the response body and server logs.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    Unauthorized:
      description: |
        The workbench identity is missing, invalid, expired, rotated or revoked.
        This response never means a campus source needs reconnection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TOKEN_EXPIRED
              message: The access token has expired.
              request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
              retryable: false
              fields: []
    ClientError:
      description: Client error. The response body follows the error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Server error. The response body follows the error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RequestIdMeta:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          description: Identifier shared by the response body and the server log entry.

    LiveStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok

    LiveResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/LiveStatus'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    ReadyStatus:
      type: object
      required:
        - status
        - schema_version
      properties:
        status:
          type: string
          enum:
            - ready
        schema_version:
          type: string
          description: Version stored in the service_meta table by the migration chain.

    ReadyResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ReadyStatus'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    ServiceMeta:
      type: object
      required:
        - service
        - version
        - api_version
        - build_id
      properties:
        service:
          type: string
          example: jlu-dela-api
        version:
          type: string
          description: Server release version.
        api_version:
          type: string
          example: v1
        build_id:
          type: string
          description: Deployment build or commit identifier.

    MetaResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ServiceMeta'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    ErrorField:
      type: object
      required:
        - path
        - code
      properties:
        path:
          type: string
          description: JSON path or field name that failed validation.
        code:
          type: string
          description: Stable field-level error code.

    ErrorDetail:
      type: object
      required:
        - code
        - message
        - request_id
        - retryable
        - fields
      properties:
        code:
          type: string
          description: Stable machine-readable error code. Clients must handle unknown values safely.
        message:
          type: string
          description: Human-readable technical message. Clients may localize by code.
        request_id:
          type: string
        retryable:
          type: boolean
          description: Whether a later retry may succeed without user action.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ErrorField'

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    PaginationMeta:
      type: object
      description: Reserved list metadata shape. No list endpoint is implemented in this contract version.
      x-reserved: true
      required:
        - next_cursor
        - has_more
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor bound to the current filters, or null when there are no more items.
        has_more:
          type: boolean

    ListMeta:
      description: Reserved list envelope metadata. No list endpoint is implemented in this contract version.
      x-reserved: true
      allOf:
        - $ref: '#/components/schemas/RequestIdMeta'
        - $ref: '#/components/schemas/PaginationMeta'

    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
          description: Opaque refresh token from the most recent token pair.

    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
          description: Refresh token of the session that the bearer token belongs to.

    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          minLength: 1
          description: Opaque access token. Expires after `expires_in` seconds.
        refresh_token:
          type: string
          minLength: 1
          description: Opaque refresh token. Rotates on every refresh; the previous value is rejected.
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.

    TokenPairResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/TokenPair'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    Me:
      type: object
      required:
        - id
        - display_name
        - timezone
      properties:
        id:
          type: string
          format: uuid
          description: Workbench user id derived from the server-side session.
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        timezone:
          type: string
          description: IANA timezone used for campus display dates. Campus dates remain Asia/Shanghai in this contract.

    MeResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/Me'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    CreateSyncJobRequest:
      type: object
      additionalProperties: false
      required:
        - source
        - resource
        - scope
      properties:
        source:
          type: string
          pattern: '^[a-z0-9_]{1,64}$'
          example: jlu_iedu
        resource:
          type: string
          pattern: '^[a-z0-9_]{1,64}$'
          example: schedule
        scope:
          type: object
          additionalProperties: true
          description: |
            Source-defined cache dataset. At most 4096 bytes when serialized.
            It must identify a snapshot (for example a semester id), not a
            client query window; do not put from/to paging values here.

    SyncJobStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed

    SyncJob:
      type: object
      required:
        - id
        - source
        - resource
        - scope
        - status
        - attempts
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Opaque job id. Clients only compare it for equality.
        source:
          type: string
        resource:
          type: string
        scope:
          type: object
          additionalProperties: true
          description: Canonical scope echoed from the request.
        status:
          $ref: '#/components/schemas/SyncJobStatus'
        attempts:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
        error:
          type: object
          nullable: true
          required:
            - code
            - retryable
          properties:
            code:
              type: string
              description: Stable source or worker error code. Never upstream error text.
            retryable:
              type: boolean
        complete:
          type: boolean
          nullable: true
          description: Whether the adapter committed a complete snapshot. Null until the job succeeds.
        snapshot_version:
          type: integer
          format: int64
          nullable: true
          description: Opaque version reported by the adapter. Clients only compare it for equality.

    SyncJobAccepted:
      allOf:
        - $ref: '#/components/schemas/SyncJob'
        - type: object
          required:
            - reused
          properties:
            reused:
              type: boolean
              description: True when an active job already existed for this user, source, resource and scope.

    SyncJobResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/SyncJob'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    SyncJobAcceptedResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/SyncJobAccepted'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'