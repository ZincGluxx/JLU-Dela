openapi: 3.0.3

info:
  title: JLU Dela HTTP API
  version: 0.1.0
  description: |
    Single source of truth for the implemented and design-only HTTP endpoints
    of the JLU Dela foundation service (planning item A01).

    Implemented endpoints:
    - GET /health/live
    - GET /health/ready
    - GET /api/v1/meta
    - POST /api/v1/auth/activate
    - POST /api/v1/auth/login
    - POST /api/v1/auth/refresh
    - POST /api/v1/auth/logout
    - GET /api/v1/me
    - GET /api/v1/todos, POST /api/v1/todos, PATCH and DELETE /api/v1/todos/{id}
    - POST /api/v1/sync-jobs, GET /api/v1/sync-jobs/{id}

    Endpoints described but not yet served:
    - GET /api/v1/calendar (contract fixed, aggregation pending the campus sources)
    - GET /api/v1/semesters, GET /api/v1/courses, GET /api/v1/schedule
      (B teaching draft, pending A and consumer review)

    The session endpoints operate on an opaque token pair. Workbench accounts
    are provisioned through controlled one-time invitations: an operator issues
    a login, display name and invitation out of band; the invitee calls `POST
    /api/v1/auth/activate` to set a password and receives the first session, and
    later calls `POST /api/v1/auth/login`. Login failures are uniform and rate
    limited. School SSO and self-service registration are not part of this
    contract. Sync jobs persist a source synchronization request. This build
    registers no source adapter, so creating a job returns 422
    UNSUPPORTED_SOURCE until B/C/D register a verified source. A job never
    reports success before its adapter succeeds. Campuses, courses, assignments,
    notices and materials remain
    planning proposals and are not available.

    Protocol conventions:
    - JSON field names use snake_case.
    - Resource identifiers are strings, including identifiers owned by campus
      sources.
    - Timestamps are UTC RFC 3339 strings with a `Z` suffix. Calendar dates use
      `YYYY-MM-DD`. The campus display timezone is `Asia/Shanghai`.
    - A successful single-object response is
      `{"data": {...}, "meta": {"request_id": "..."}}`.
    - A successful list response puts the array in `data` and adds
      `next_cursor` and `has_more` to `meta`. `next_cursor` is an opaque
      string or null. The default page size is 50 and the maximum is 100.
    - Clients may send `X-Request-Id`; otherwise the server generates one. The
      value is echoed in the response header and in `meta.request_id` or
      `error.request_id`, and it is the same identifier used in logs.
    - Errors always use
      `{"error": {"code": "...", "message": "...", "request_id": "...", "retryable": false, "fields": []}}`.
      `fields` contains `{"path": "...", "code": "..."}` objects for validation
      errors. Clients must render unknown error codes safely.
    - A nullable field is always present and may be null. An optional field may
      be omitted. In PATCH requests, an omitted field keeps its current value;
      explicit null clears a field only when the schema marks it nullable.
    - Unknown write fields are rejected with 422. Clients ignore unknown response
      fields.
    - 401 means the workbench identity is invalid or a login cannot be
      authenticated. Its codes are `AUTH_REQUIRED`, `INVALID_TOKEN`,
      `TOKEN_EXPIRED`, `SESSION_REVOKED`, `INVALID_INVITE` and
      `INVALID_CREDENTIALS`. A campus source failure is never a 401 and must not
      log the user out of the workbench.
      403 means the identity may not perform the operation. Missing and
      invisible private objects both use 404. 409 is a write or idempotency
      conflict, 422 a validation failure, 429 includes `Retry-After`, and 503
      means the service is temporarily unable to serve the request.
  contact:
    name: JLU Dela contributors
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0-or-later.html

security: []

servers:
  - url: http://127.0.0.1:8080
    description: Local development. Clients must override this address at build or runtime.

tags:
  - name: Health
    description: Process liveness and dependency readiness probes.
  - name: Meta
    description: Public build and contract identity.
  - name: Auth
    description: Controlled-invitation activation and workbench session lifecycle. Campus source authorization is separate.
  - name: Me
    description: The authenticated workbench user.
  - name: Todos
    description: Personal todos with idempotent creation and optimistic concurrency.
  - name: Calendar
    description: Study calendar aggregation over lessons, assignments and personal todos.
  - name: Sync
    description: Persisted source synchronization jobs. Source adapters are owned by B/C/D.
  - name: Teaching
    description: Draft reads of saved semesters, shared courses and expanded lessons. Not implemented.

x-contract-status:
  implemented:
    - GET /health/live
    - GET /health/ready
    - GET /api/v1/meta
    - POST /api/v1/auth/activate
    - POST /api/v1/auth/login
    - POST /api/v1/auth/refresh
    - POST /api/v1/auth/logout
    - GET /api/v1/me
    - GET /api/v1/todos
    - POST /api/v1/todos
    - PATCH /api/v1/todos/{id}
    - DELETE /api/v1/todos/{id}
    - POST /api/v1/sync-jobs
    - GET /api/v1/sync-jobs/{id}
  design-only:
    - GET /api/v1/calendar
    - GET /api/v1/semesters
    - GET /api/v1/courses
    - GET /api/v1/schedule
  note: Accounts are created only by controlled invitation; there is no self-service registration or school SSO. Connections, campuses, courses, assignments, notices and materials are not exposed by the service and must not be treated as available. Sync jobs exist, but no source adapter is registered in this build.

paths:
  /health/live:
    get:
      operationId: getHealthLive
      tags:
        - Health
      summary: Report process liveness
      description: Returns success while the HTTP process can serve requests. This check does not touch PostgreSQL.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /health/ready:
    get:
      operationId: getHealthReady
      tags:
        - Health
      summary: Report database readiness
      description: Checks that PostgreSQL is reachable and that the service metadata migration has been applied.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: PostgreSQL is reachable and the schema is ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                data:
                  status: ready
                  schema_version: '1'
                meta:
                  request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
        '503':
          description: PostgreSQL is unavailable or the schema has not been migrated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: DATABASE_UNAVAILABLE
                  message: Database is unavailable.
                  request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
                  retryable: true
                  fields: []
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/meta:
    get:
      operationId: getMeta
      tags:
        - Meta
      summary: Return public service identity
      description: Returns the service version, API version and the build identifier supplied by the deployment. It does not expose configuration or credentials.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Public service identity.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
              example:
                data:
                  service: jlu-dela-api
                  version: 0.1.0
                  api_version: v1
                  build_id: 6a3c413
                meta:
                  request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/activate:
    post:
      operationId: activateAccount
      tags:
        - Auth
      summary: Activate an invited workbench account
      description: |
        Exchanges a one-time invitation for a workbench account. The operator
        issues the invitation out of band together with the login and display
        name, so the invitee only chooses a password. The invitation is consumed
        in the same transaction that creates the user and the first session, so
        one invitation can activate at most one account even when two requests
        race.

        The password is 12-128 Unicode code points with no character-class
        requirement, and it must differ from the invitation's login. The
        invitation login is normalized when the operator creates the
        invitation, not by this request.

        An invalid, expired or already used invitation returns the same 401
        `INVALID_INVITE` body, so the response does not reveal whether the token
        ever existed. Clients must not log the invitation token.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
      responses:
        '200':
          description: The account is activated and a fresh token pair is issued.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/InvalidInvite'
        '415':
          $ref: '#/components/responses/ClientError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/login:
    post:
      operationId: loginAccount
      tags:
        - Auth
      summary: Exchange a login and password for a session
      description: |
        Verifies a workbench password and issues a new session. The server trims
        leading and trailing whitespace and lowercases `login` before validating
        it, so mixed-case input is accepted but stored and compared in lower
        case.

        A wrong password, an unknown login, a user without a password and a
        disabled user all return the same 401 `INVALID_CREDENTIALS` body and
        cost one password verification, so the response does not reveal whether
        an account exists. Consecutive failures are counted per account: five
        failures within 15 minutes lock the account for 15 minutes, and further
        attempts return 429 `RATE_LIMITED` with `Retry-After` seconds even when
        the supplied password is correct. A successful login clears the counter.
        The limiter is per account, not per IP address.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: A fresh token pair.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '415':
          $ref: '#/components/responses/ClientError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - Auth
      summary: Rotate the session token pair
      description: |
        Exchanges a current refresh token for a new access and refresh token.
        Both tokens rotate on every call. A token that was already rotated,
        revoked or expired is rejected, and the client must return to the
        workbench login entry point. This endpoint is not used to reconnect a
        campus source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A fresh token pair.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/ClientError'
        '422':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/logout:
    post:
      operationId: logoutSession
      tags:
        - Auth
      summary: Revoke the current session
      description: |
        Revokes the session identified by the bearer token. The refresh token in
        the body must belong to the same session. After this call both tokens are
        invalid, other sessions of the same user stay usable, and campus source
        credentials are not affected unless their owner revokes them separately.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: The session is revoked. The response has no body.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/ClientError'
        '422':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/me:
    get:
      operationId: getMe
      tags:
        - Me
      summary: Return the authenticated workbench user
      description: |
        The user id always comes from the session on the server. Clients must not
        send or choose a user id. The response contains no campus source session
        or credential.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current workbench user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                data:
                  id: 0b6a4f8e-6f0e-4a5c-9b6d-2f4a7c1d8e30
                  display_name: 示例用户
                  timezone: Asia/Shanghai
                meta:
                  request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '5XX':
          $ref: '#/components/responses/ServerError'


  /api/v1/todos:
    get:
      operationId: listTodos
      tags:
        - Todos
      security:
        - bearerAuth: []
      summary: List the caller's todos
      description: |
        The caller is the user of the bearer session. The server ignores any
        user identifier supplied by the client.

        Sorted by the effective due key ascending with nulls last, then by `id`
        ascending so the order is stable across pages.

        The effective due key is `COALESCE(due_at, due_date at Asia/Shanghai
        midnight)`, so a `date_only` todo sorts as the start of that calendar
        day in the display timezone, not as UTC midnight.

        The cursor is bound to the `completed` filter: changing the filter
        mid-pagination returns 400 `BAD_CURSOR`.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: completed
          in: query
          required: false
          description: Filter by completion state. Omit to return both.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque `meta.next_cursor` from the previous page. Clients must not construct it.
          schema:
            type: string
      responses:
        '200':
          description: One page of todos.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoListResponse'
              example:
                data:
                  - id: 38da5dcb-f7e1-4d24-9d63-6b0f17868f20
                    title: 整理课堂笔记
                    notes: ''
                    due_kind: exact
                    due_date: null
                    due_at: '2026-11-12T09:00:00Z'
                    color: teal
                    completed: false
                    show_in_calendar: true
                    revision: 1
                    created_at: '2026-11-10T12:00:00Z'
                    updated_at: '2026-11-10T12:00:00Z'
                  - id: 5b2f3a10-9c4e-4a71-8d55-2e6f7b1c3d90
                    title: 交第三章作业
                    notes: ''
                    due_kind: date_only
                    due_date: '2026-11-13'
                    due_at: null
                    color: null
                    completed: false
                    show_in_calendar: true
                    revision: 1
                    created_at: '2026-11-10T12:05:00Z'
                    updated_at: '2026-11-10T12:05:00Z'
                meta:
                  request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
                  next_cursor: null
                  has_more: false
        '400':
          $ref: '#/components/responses/BadCursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createTodo
      tags:
        - Todos
      security:
        - bearerAuth: []
      summary: Create a todo idempotently
      description: |
        The `Idempotency-Key` header carries a client-generated UUID and is
        valid for 24 hours:

        - same key and same request: returns the first result again with 201
        - same key and a different request: 409 `IDEMPOTENCY_CONFLICT`
        - the idempotency record and the todo are written in one transaction

        The server trims `title` before validating 1-200 characters. `notes` is
        limited to 20,000 characters. `id`, `revision`, `owner_id` and
        `source_status` are server-managed and rejected with 422.

        Omitting `due_kind` makes the server infer it from the values supplied:
        `due_at` alone means `exact`, `due_date` alone means `date_only`, and no
        due field at all means `none`. Supplying both `due_at` and `due_date`,
        or a `due_kind` that does not match the values, is rejected with 422 and
        `fields[].path` points at the conflicting field.

        Creation infers the kind from the values; update never does. Once a
        todo exists, changing its deadline requires an explicit `due_kind`.

        A missing or malformed `Idempotency-Key` is 422 with
        `fields[].path = "Idempotency-Key"`, not 400 or 401.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID. A retry of the same creation must reuse the same value.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
            example:
              title: 整理课堂笔记
              notes: ''
              due_kind: exact
              due_at: '2026-11-12T09:00:00Z'
              color: teal
              show_in_calendar: true
      responses:
        '201':
          description: Created. A retry with the same idempotency key returns the same body.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
              example:
                data:
                  id: 38da5dcb-f7e1-4d24-9d63-6b0f17868f20
                  title: 整理课堂笔记
                  notes: ''
                  due_kind: exact
                  due_date: null
                  due_at: '2026-11-12T09:00:00Z'
                  color: teal
                  completed: false
                  show_in_calendar: true
                  revision: 1
                  created_at: '2026-11-10T12:00:00Z'
                  updated_at: '2026-11-10T12:00:00Z'
                meta:
                  request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/todos/{id}:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTodo
      tags:
        - Todos
      security:
        - bearerAuth: []
      summary: Update a todo with optimistic concurrency
      description: |
        `revision` is required. Fields that are absent keep their current value.

        Due fields are replaced as a group: once `due_kind` appears in the body,
        the server writes all three due fields at once and clears whichever one
        the kind does not use. `{"revision": 2, "due_kind": "none"}` therefore
        clears the deadline.

        Supplying `due_date` or `due_at` (including an explicit `null`) without
        `due_kind` is rejected with 422 and `fields[].path` at the stray field.
        The update never infers the kind, so a client that sends
        `Optional.present(null)` on a nullable due field cannot silently leave
        the stored deadline in place. Clearing a deadline always means sending
        an explicit `due_kind`.

        A body that carries only `revision` is accepted and still increments
        `revision` by one.

        `color` has three states: absent keeps the current value, explicit
        `null` restores the default colour, and a value sets it. Generated Dart
        clients must be able to tell "absent" from "explicit null", otherwise
        they cannot express "restore the default colour".

        A stale `revision` returns 409 `REVISION_CONFLICT` with the server's
        current todo in `error.current`, so the client can keep the user's draft
        and let them choose. A successful update increments `revision` by one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
            example:
              revision: 1
              title: 整理课堂笔记（含例题）
              due_kind: date_only
              due_date: '2026-11-14'
              completed: true
      responses:
        '200':
          description: The updated todo.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deleteTodo
      tags:
        - Todos
      security:
        - bearerAuth: []
      summary: Soft-delete a todo with optimistic concurrency
      description: |
        `If-Match` carries the revision the client holds, as a decimal string.
        A stale revision returns 409 `REVISION_CONFLICT`; the client should
        refetch and decide again.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The revision the client holds, for example `"3"`.
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/semesters:
    get:
      operationId: listSemesters
      tags:
        - Teaching
      security:
        - bearerAuth: []
      x-contract-status: design-only
      x-review-status: draft
      summary: List the caller's saved semesters
      description: |
        Draft only; this route is not implemented. Reads normalized workbench
        data for the bearer user and does not initiate a campus request.
        `current_semester_id` is null without reliable current-term evidence.

        Sort by `starts_on` descending, nulls last, then `id` ascending. The
        cursor must continue into the null-date region and is bound to the
        user and ordering. A malformed or mismatched cursor returns 422
        `BAD_CURSOR`; other invalid query values return 422 `VALIDATION_FAILED`.

        An unobserved source returns an empty list with `never_synced`; a
        complete empty snapshot returns an empty list with `current`. A failed
        refresh keeps saved data and reports `stale` with `last_error_code`.
        Source authorization failure does not turn this cached read into 409
        or invalidate the workbench identity.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListCursor'
      responses:
        '200':
          description: One page of saved semesters and source snapshot metadata.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'
  /api/v1/courses:
    get:
      operationId: listCourses
      tags:
        - Teaching
      security:
        - bearerAuth: []
      x-contract-status: design-only
      x-review-status: draft
      summary: List the caller's shared course offerings
      description: |
        Draft only; this route is not implemented. Reads saved normalized
        courses for the bearer user. Omitting a filter leaves it unrestricted.
        `semester_id` matches exactly; a missing or invisible semester returns
        404. Courses with an unknown semester have `semester_id: null` and
        appear only when no semester filter is supplied. A source filter
        matches a course with that source association, without discarding its
        other `source_refs`. Equal course names do not imply shared identity.

        Sort by source `name` ascending, then `id` ascending, regardless of the
        user's remark. The cursor binds the user, all filters and ordering.
        Malformed or mismatched cursors return 422 `BAD_CURSOR`; other invalid
        query values return 422 `VALIDATION_FAILED`.

        Per-source metadata is a draft choice pending A/C/E review. With a
        source filter, `source_snapshots` contains exactly that source; without
        it, it contains `jlu_iedu` then `chaoxing`, including sources never
        synced. Source failures preserve cached records and are reported in
        the corresponding snapshot, not as 409 or a workbench 401.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: semester_id
          in: query
          required: false
          description: Exact workbench semester ID owned by the caller.
          schema:
            type: string
            format: uuid
        - name: source
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TeachingSource'
        - name: retained
          in: query
          required: false
          description: Filter the user's retained preference. Omit to return both values.
          schema:
            type: boolean
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListCursor'
      responses:
        '200':
          description: One page of saved course offerings and per-source snapshot metadata.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'
  /api/v1/schedule:
    get:
      operationId: getSchedule
      tags:
        - Teaching
      security:
        - bearerAuth: []
      x-contract-status: design-only
      x-review-status: draft
      summary: List the caller's expanded lessons in a semester and date range
      description: |
        Draft only; this route is not implemented. Reads saved actual lesson
        occurrences for the bearer user. A missing or invisible semester
        returns 404. `semester_id`, `from` and `to` are all required.

        `from` is inclusive and `to` exclusive, interpreted as campus dates in
        `Asia/Shanghai`; `from < to` and the range is at most 93 calendar days.
        Convert both midnights to UTC before applying interval overlap:
        `starts_at < to AND ends_at > from`, including cross-midnight lessons.
        Unknown school dates or period times must not produce guessed lessons.

        Sort by `starts_at` ascending, then `id` ascending. The cursor binds
        the user, semester, date range and ordering. Malformed or mismatched
        cursors return 422 `BAD_CURSOR`; other invalid query values return 422
        `VALIDATION_FAILED`. Calendar aggregation must traverse every page or
        use an equivalent complete internal range query.

        Snapshot metadata describes the requested range. A failed refresh
        preserves cached lessons and reports `stale` and `last_error_code`,
        including `SOURCE_AUTH_REQUIRED`; it does not turn this read into 409.
        Partial observations never remove unseen lessons. Removal after a
        cancellation or move requires a complete, serially confirmed scope;
        the device upload and concurrency protocol remains owned by A.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: semester_id
          in: query
          required: true
          description: Workbench semester ID owned by the caller.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          description: Inclusive start day in Asia/Shanghai.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Exclusive end day in Asia/Shanghai, at most 93 days after from.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListCursor'
      responses:
        '200':
          description: One page of actual lessons and snapshot metadata for the requested range.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'
  /api/v1/calendar:
    get:
      operationId: getCalendar
      tags:
        - Calendar
      security:
        - bearerAuth: []
      summary: Read study calendar entries in a date range
      description: |
        `from` is inclusive and `to` is exclusive, both interpreted as calendar
        days in `Asia/Shanghai`. The first release accepts at most 93 days.

        Boundaries use interval overlap rather than point containment:

        - lesson: `starts_at < to AND ends_at > from`
        - assignment and todo: `due_at >= from AND due_at < to`, or the whole
          calendar day for `date_only`

        `items` is a discriminated union on `kind` (`lesson`, `assignment`,
        `todo`). Lessons come from the timetable source, assignments from the
        assignment source and todos from this service. An assignment is never
        duplicated into a todo.

        Ordering is stable: time ascending, then `kind` in the fixed order
        lesson, assignment, todo, then title, then id.

        A failing campus source does not remove the other sources' items; its
        state is reported structurally in `sources[]`.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: from
          in: query
          required: true
          description: Inclusive start day in Asia/Shanghai.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Exclusive end day in Asia/Shanghai.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Calendar entries plus the state of each contributing source.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
              example:
                data:
                  from: '2026-11-10'
                  to: '2026-11-17'
                  items:
                    - kind: lesson
                      id: 'lesson:123:2026-11-10T00:00:00Z'
                      lesson_id: '123'
                      course_offering_id: 7f1c2a64-0b7b-4b9c-9f4f-0d1f0c8e6a11
                      title: 高等数学
                      starts_at: '2026-11-10T00:00:00Z'
                      ends_at: '2026-11-10T01:40:00Z'
                      location: 逸夫楼201
                      period_start: 1
                      period_end: 2
                    - kind: assignment
                      id: 'assignment:456'
                      assignment_id: '456'
                      course_offering_id: 7f1c2a64-0b7b-4b9c-9f4f-0d1f0c8e6a11
                      title: 第三章作业
                      due_at: '2026-11-12T09:00:00Z'
                      due_kind: exact
                      timing_text: ''
                      source_status: pending
                      read_at: null
                      muted_at: null
                    - kind: todo
                      id: 'todo:789'
                      todo_id: 38da5dcb-f7e1-4d24-9d63-6b0f17868f20
                      title: 整理课堂笔记
                      due_kind: exact
                      due_at: '2026-11-12T09:00:00Z'
                      due_date: null
                      color: teal
                      show_in_calendar: true
                      completed: false
                  sources:
                    - source: jlu_iedu
                      status: connected
                      last_success_at: '2026-11-10T11:50:00Z'
                    - source: chaoxing
                      status: auth_required
                      last_success_at: '2026-11-09T22:14:00Z'
                meta:
                  request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/SourceAuthRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '4XX':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'
  /api/v1/sync-jobs:
    post:
      operationId: createSyncJob
      tags:
        - Sync
      summary: Queue a source synchronization
      description: |
        Persists a sync job and returns 202 before any source work starts.
        Repeating the same user, source, resource and canonical scope while a job
        is queued or running returns that job with `reused: true`; it does not
        replay work or create a second job. A queued or running job is executed
        by one worker. An interrupted process is recovered after its lease
        expires; after three attempts the job fails with `SYNC_INTERRUPTED`.
        No source adapter is registered in this build, so every source currently
        returns 422 UNSUPPORTED_SOURCE.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSyncJobRequest'
      responses:
        '202':
          description: The job is persisted. It may be the existing active job.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobAcceptedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/ClientError'
        '422':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /api/v1/sync-jobs/{id}:
    get:
      operationId: getSyncJob
      tags:
        - Sync
      summary: Read a sync job owned by the current user
      description: |
        Returns the persisted job. Jobs of other users, unknown ids and invalid
        ids all return 404 SYNC_JOB_NOT_FOUND. The response never contains source
        payloads, credentials or upstream error text.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: id
          in: path
          required: true
          description: Opaque sync job id.
          schema:
            type: string
      responses:
        '200':
          description: The sync job.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ClientError'
        '5XX':
          $ref: '#/components/responses/ServerError'


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Opaque access token from the workbench session, sent as
        `Authorization: Bearer <access_token>`. Access tokens expire after 15
        minutes and rotate together with the refresh token. Clients must store
        tokens in the platform secure storage and never log them.

  parameters:
    ListLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of records on this page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ListCursor:
      name: cursor
      in: query
      required: false
      description: Opaque meta.next_cursor from the previous page, bound to the caller, filters and ordering.
      schema:
        type: string
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client request identifier. The server echoes it in the response header and body.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  headers:
    XRequestId:
      description: Request identifier used by the response body and server logs.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    RetryAfter:
      description: Seconds the client must wait before attempting this login again.
      schema:
        type: integer
        minimum: 1

  responses:
    Unauthorized:
      description: |
        The workbench identity is missing, invalid, expired, rotated or revoked.
        This response never means a campus source needs reconnection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TOKEN_EXPIRED
              message: The access token has expired.
              request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
              retryable: false
              fields: []
    InvalidInvite:
      description: |
        The invitation is invalid, expired or already used. All three cases use
        the same status, code and message so the response cannot be used to test
        whether an invitation token exists. This is not a session failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_INVITE
              message: The invitation is invalid, expired or already used.
              request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
              retryable: false
              fields: []
    InvalidCredentials:
      description: |
        The login or password is invalid. An unknown login, a wrong password, a
        user without a password and a disabled user all use this response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_CREDENTIALS
              message: The login or password is invalid.
              request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
              retryable: false
              fields: []
    RateLimited:
      description: |
        Too many failed login attempts for this account. The reply carries
        `Retry-After` in seconds; the client must wait that long before trying
        the same account again.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Too many login attempts. Try again later.
              request_id: 95fd0c0e-0d5d-4d8d-a2b1-6e1f8e80d0c1
              retryable: true
              fields: []
    ClientError:
      description: Client error. The response body follows the error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Server error. The response body follows the error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: The object does not exist or is not visible to the caller. Both cases use 404 so existence does not leak.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadCursor:
      description: The cursor is malformed or does not match the current filters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Field validation failed. `error.fields` names each offending path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: The idempotency key was already used with a different request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RevisionConflict:
      description: The object was modified by another client. `error.current` carries the server's current version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionConflictResponse'
    SourceAuthRequired:
      description: |
        A campus source needs to be reconnected (409 + `SOURCE_AUTH_REQUIRED`).
        Its data may be stale. Clients must guide the user to reconnect that
        source and must not sign the user out of the workbench identity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RequestIdMeta:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          description: Identifier shared by the response body and the server log entry.

    LiveStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok

    LiveResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/LiveStatus'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    ReadyStatus:
      type: object
      required:
        - status
        - schema_version
      properties:
        status:
          type: string
          enum:
            - ready
        schema_version:
          type: string
          description: Version stored in the service_meta table by the migration chain.

    ReadyResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ReadyStatus'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    ServiceMeta:
      type: object
      required:
        - service
        - version
        - api_version
        - build_id
      properties:
        service:
          type: string
          example: jlu-dela-api
        version:
          type: string
          description: Server release version.
        api_version:
          type: string
          example: v1
        build_id:
          type: string
          description: Deployment build or commit identifier.

    MetaResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ServiceMeta'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    ErrorField:
      type: object
      required:
        - path
        - code
      properties:
        path:
          type: string
          description: JSON path or field name that failed validation.
        code:
          type: string
          description: Stable field-level error code.

    ErrorDetail:
      type: object
      required:
        - code
        - message
        - request_id
        - retryable
        - fields
      properties:
        code:
          type: string
          description: Stable machine-readable error code. Clients must handle unknown values safely.
        message:
          type: string
          description: Human-readable technical message. Clients may localize by code.
        request_id:
          type: string
        retryable:
          type: boolean
          description: Whether a later retry may succeed without user action.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ErrorField'

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    PaginationMeta:
      type: object
      description: List metadata shared by paginated endpoints.
      required:
        - next_cursor
        - has_more
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor bound to the current filters, or null when there are no more items.
        has_more:
          type: boolean

    ListMeta:
      description: List envelope metadata for paginated endpoints.
      allOf:
        - $ref: '#/components/schemas/RequestIdMeta'
        - $ref: '#/components/schemas/PaginationMeta'

    TeachingSource:
      type: string
      description: Campus sources supported by the draft teaching course contract.
      enum:
        - jlu_iedu
        - chaoxing

    SourceRef:
      type: object
      description: |
        Source identity within the current user. The mapping key consists of
        the authenticated user, source, source_scope and source_id. Re-reading
        this key preserves the workbench UUID. School field mappings and scope
        values must be verified from source responses, not inferred from names.
      required:
        - source
        - source_id
        - source_scope
      properties:
        source:
          $ref: '#/components/schemas/TeachingSource'
        source_id:
          type: string
          minLength: 1
          description: Original source identifier preserved as a string.
        source_scope:
          type: string
          minLength: 1
          description: Source-defined scope that disambiguates the original identifier; draft string representation pending source review.

    Semester:
      type: object
      required:
        - id
        - name
        - starts_on
        - ends_on
        - timezone
        - source_ref
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          description: Nonempty semester display name from the source.
        starts_on:
          type: string
          format: date
          nullable: true
          description: School-defined teaching-week origin; unknown is null, never the collection date or an assumed Monday.
        ends_on:
          type: string
          format: date
          nullable: true
        timezone:
          type: string
          enum:
            - Asia/Shanghai
        source_ref:
          description: Verified teaching source identity; semesters in this draft come from jlu_iedu.
          allOf:
            - $ref: '#/components/schemas/SourceRef'

    CourseOffering:
      type: object
      description: |
        A course owned by the bearer user. Equal names do not merge offerings
        across sources. Display a nonempty remark in preference to name.
        Source refreshes preserve remark and retained, whose writes belong to
        C. Removing one source association must not delete a course still
        referenced by another source. Cross-source merging requires a separate
        reviewed contract for downstream references.
      required:
        - id
        - semester_id
        - name
        - teacher
        - source_refs
        - remark
        - retained
      properties:
        id:
          type: string
          format: uuid
        semester_id:
          type: string
          format: uuid
          nullable: true
          description: Owned workbench semester, or null when the source has no reliable mapping.
        name:
          type: string
          minLength: 1
        teacher:
          type: string
          nullable: true
          description: Preserve the source display text when it contains multiple teachers.
        source_refs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceRef'
        remark:
          type: string
          nullable: true
        retained:
          type: boolean
          default: true

    Lesson:
      type: object
      description: |
        One actual lesson with a stable workbench ID and a course owned by the
        caller. starts_at must precede ends_at. period_start and period_end are
        both null or both positive with start <= end. Unknown concrete dates
        or times are parsing issues, not fabricated lessons. Use verified
        school calendar and period times; teaching weeks need not start on a
        natural Monday. A source lesson ID takes precedence for identity;
        sources without one require separately reviewed deduplication and
        rescheduling rules.

        For E's existing LessonItem, use kind=lesson, lesson_id=this id and
        item id=lesson:<id>:<starts_at>; copy the remaining lesson fields.
      required:
        - id
        - course_offering_id
        - title
        - starts_at
        - ends_at
        - location
        - period_start
        - period_end
      properties:
        id:
          type: string
          format: uuid
        course_offering_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          description: Source course name for the calendar lesson title.
        starts_at:
          type: string
          format: date-time
          pattern: 'Z$'
        ends_at:
          type: string
          format: date-time
          pattern: 'Z$'
        location:
          type: string
          nullable: true
        period_start:
          type: integer
          minimum: 1
          nullable: true
        period_end:
          type: integer
          minimum: 1
          nullable: true

    SnapshotMeta:
      type: object
      description: |
        State of saved source data for the stated coverage, not just this page.
        A never-synced read is empty; a successfully saved complete empty
        snapshot is current. Failed refreshes keep cached records and mark
        stale. A partial read cannot mark a scope current or delete unseen
        records. Device observation is not school-signed authentication.
      required:
        - status
        - last_success_at
        - last_attempt_at
        - observed_at
        - last_error_code
        - coverage
      properties:
        status:
          type: string
          enum:
            - never_synced
            - current
            - stale
        last_success_at:
          type: string
          format: date-time
          pattern: 'Z$'
          nullable: true
          description: Server time when a complete snapshot for this scope was successfully saved, or null if none.
        last_attempt_at:
          type: string
          format: date-time
          pattern: 'Z$'
          nullable: true
        observed_at:
          type: string
          format: date-time
          pattern: 'Z$'
          nullable: true
          description: Source content observation time, distinct from server save time.
        last_error_code:
          type: string
          nullable: true
          description: SOURCE_AUTH_REQUIRED, SOURCE_NETWORK_ERROR, SOURCE_TIMEOUT, SOURCE_PROTOCOL_ERROR or another stable code; network and protocol errors do not imply lost authorization.
        coverage:
          type: object
          additionalProperties: true
          description: |
            Draft source scope, pending A and consumer review. Semesters use
            an empty object for the user's source-wide semester list. Courses
            use an empty object or semester_id for a semester filter. Schedule
            uses semester_id, from and to (campus dates matching the query).
            Pagination and retained are result filters, not collection scopes.

    SourceSnapshot:
      type: object
      required:
        - source
        - snapshot
      properties:
        source:
          $ref: '#/components/schemas/TeachingSource'
        snapshot:
          $ref: '#/components/schemas/SnapshotMeta'

    SemesterListMeta:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required:
            - current_semester_id
            - snapshot
          properties:
            current_semester_id:
              type: string
              format: uuid
              nullable: true
              description: Current semester established by source evidence, or null. It need not be on this page.
            snapshot:
              $ref: '#/components/schemas/SnapshotMeta'

    CourseListMeta:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required:
            - source_snapshots
          properties:
            source_snapshots:
              type: array
              minItems: 1
              maxItems: 2
              description: Draft per-source states pending A/C/E review; exactly the filtered source, otherwise jlu_iedu then chaoxing, with no duplicates.
              items:
                $ref: '#/components/schemas/SourceSnapshot'

    ScheduleListMeta:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required:
            - snapshot
          properties:
            snapshot:
              $ref: '#/components/schemas/SnapshotMeta'

    SemesterListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Semester'
        meta:
          $ref: '#/components/schemas/SemesterListMeta'

    CourseListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CourseOffering'
        meta:
          $ref: '#/components/schemas/CourseListMeta'

    ScheduleListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
        meta:
          $ref: '#/components/schemas/ScheduleListMeta'

    Todo:
      type: object
      description: |
        A personal todo. The due fields are discriminated by `due_kind`, and the
        other two must be null:

        | due_kind | due_date | due_at | Example |
        |---|---|---|---|
        | `none` | null | null | no deadline |
        | `date_only` | `2026-11-13` | null | due Friday |
        | `exact` | null | `2026-11-13T09:00:00Z` | due Friday 17:00 Beijing |

        A `date_only` todo occupies the whole calendar day in Asia/Shanghai and
        becomes overdue at the next local midnight. Only `exact` shows a time and
        drives a precise countdown. `none` appears in the todo list only and never
        in the calendar.
      required:
        - id
        - title
        - notes
        - due_kind
        - due_date
        - due_at
        - color
        - completed
        - show_in_calendar
        - revision
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed by the server, then validated as 1-200 characters.
        notes:
          type: string
          maxLength: 20000
        due_kind:
          type: string
          enum:
            - none
            - date_only
            - exact
          description: Personal todos use these three only. `relative` and `unknown` describe assignment source uncertainty.
        due_date:
          type: string
          format: date
          nullable: true
          description: Set only when `due_kind=date_only`. A calendar day in Asia/Shanghai.
        due_at:
          type: string
          format: date-time
          nullable: true
          description: Set only when `due_kind=exact`. UTC RFC 3339 with a `Z` suffix.
        color:
          type: string
          nullable: true
          enum:
            - rose
            - peach
            - sand
            - sage
            - teal
            - blue
            - lilac
            - slate
            - null
          description: Calendar colour key, matching the legacy `calendarEventColors`. Null renders as the default slate.
        completed:
          type: boolean
        show_in_calendar:
          type: boolean
          description: Whether the todo appears in the calendar. Has no effect while `due_kind=none`.
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTodoRequest:
      type: object
      required:
        - title
      additionalProperties: false
      description: |
        Omitting `due_kind` makes the server infer it from the values supplied:
        `due_at` alone means `exact`, `due_date` alone means `date_only`, and no
        due field at all means `none`. Supplying both `due_at` and `due_date`,
        or a `due_kind` that does not match the values, is rejected with 422 and
        `fields[].path` points at the conflicting field.

        Creation infers the kind from the values; update never does.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 20000
          default: ''
        due_kind:
          type: string
          enum:
            - none
            - date_only
            - exact
          description: |
            Omitting this field means `none`, which is what the server stores.
            The default is documented rather than declared because
            openapi-generator emits an illegal `const XEnum._('none')` for an
            enum with a schema default, and Dart enhanced enums cannot be
            instantiated.
        due_date:
          type: string
          format: date
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        color:
          type: string
          nullable: true
          enum:
            - rose
            - peach
            - sand
            - sage
            - teal
            - blue
            - lilac
            - slate
            - null
        show_in_calendar:
          type: boolean
          default: true

    UpdateTodoRequest:
      type: object
      required:
        - revision
      additionalProperties: false
      description: |
        Absent fields keep their current value.

        Due fields are replaced as a group: once `due_kind` appears, the server
        writes all three due fields and clears whichever one the kind does not
        use, so `{"revision": 2, "due_kind": "none"}` clears the deadline.

        Supplying `due_date` or `due_at` (including an explicit `null`) without
        `due_kind` is rejected with 422: the update never infers the kind, so a
        client cannot silently leave the stored deadline in place by sending
        `Optional.present(null)`.

        A body that carries only `revision` is accepted and still increments
        `revision` by one.

        `color` is three-state: absent keeps the value, explicit null restores
        the default, a value sets it. Generated clients must distinguish absent
        from explicit null to express "restore the default colour".
      properties:
        revision:
          type: integer
          minimum: 1
          description: The revision the client last read.
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 20000
        due_kind:
          type: string
          enum:
            - none
            - date_only
            - exact
        due_date:
          type: string
          format: date
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        color:
          type: string
          nullable: true
          enum:
            - rose
            - peach
            - sand
            - sage
            - teal
            - blue
            - lilac
            - slate
            - null
        completed:
          type: boolean
        show_in_calendar:
          type: boolean

    TodoResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/Todo'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    TodoListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
        meta:
          $ref: '#/components/schemas/ListMeta'

    RevisionConflictDetail:
      allOf:
        - $ref: '#/components/schemas/ErrorDetail'
        - type: object
          required:
            - current
          properties:
            current:
              description: The server's current version, so the client can show it and let the user decide.
              allOf:
                - $ref: '#/components/schemas/Todo'

    RevisionConflictResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/RevisionConflictDetail'

    CalendarResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/CalendarData'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    CalendarData:
      type: object
      required:
        - from
        - to
        - items
        - sources
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalendarItem'
        sources:
          type: array
          description: State of each campus source contributing to this range.
          items:
            $ref: '#/components/schemas/SourceStatus'

    CalendarItem:
      x-dart-discriminated-union: true
      oneOf:
        - $ref: '#/components/schemas/LessonItem'
        - $ref: '#/components/schemas/AssignmentItem'
        - $ref: '#/components/schemas/TodoItem'
      discriminator:
        propertyName: kind
        mapping:
          lesson: '#/components/schemas/LessonItem'
          assignment: '#/components/schemas/AssignmentItem'
          todo: '#/components/schemas/TodoItem'

    LessonItem:
      type: object
      required:
        - kind
        - id
        - lesson_id
        - course_offering_id
        - title
        - starts_at
        - ends_at
      properties:
        kind:
          type: string
          enum:
            - lesson
        id:
          type: string
          description: '`lesson:<lesson_id>:<starts_at>`, unique per occurrence of a course.'
        lesson_id:
          type: string
        course_offering_id:
          type: string
        title:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        location:
          type: string
          nullable: true
        period_start:
          type: integer
          nullable: true
        period_end:
          type: integer
          nullable: true

    AssignmentItem:
      type: object
      required:
        - kind
        - id
        - assignment_id
        - title
        - due_kind
      properties:
        kind:
          type: string
          enum:
            - assignment
        id:
          type: string
          description: '`assignment:<assignment_id>`'
        assignment_id:
          type: string
        course_offering_id:
          type: string
          nullable: true
        title:
          type: string
        due_at:
          type: string
          format: date-time
          nullable: true
          description: May be set only when `due_kind` is `exact` or `date_only`.
        due_kind:
          type: string
          enum:
            - exact
            - date_only
            - relative
            - unknown
        timing_text:
          type: string
          description: Source wording such as "3 days left". Kept verbatim; never converted into a timestamp.
        source_status:
          type: string
        read_at:
          type: string
          format: date-time
          nullable: true
        muted_at:
          type: string
          format: date-time
          nullable: true

    TodoItem:
      type: object
      description: |
        A personal todo on the calendar. The due kind carries over:

        - `exact`: `due_at` is set, it occupies an instant and drives a precise countdown
        - `date_only`: `due_date` is set, it fills the whole day and is overdue from the next local midnight
        - `none`: never appears in this endpoint
      required:
        - kind
        - id
        - todo_id
        - title
        - due_kind
        - show_in_calendar
        - completed
      properties:
        kind:
          type: string
          enum:
            - todo
        id:
          type: string
          description: '`todo:<todo_id>`'
        todo_id:
          type: string
          format: uuid
        title:
          type: string
        due_kind:
          type: string
          enum:
            - date_only
            - exact
        due_date:
          type: string
          format: date
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        color:
          type: string
          nullable: true
          enum:
            - rose
            - peach
            - sand
            - sage
            - teal
            - blue
            - lilac
            - slate
            - null
          description: Null renders as the default slate.
        show_in_calendar:
          type: boolean
        completed:
          type: boolean

    SourceStatus:
      type: object
      required:
        - source
        - status
      properties:
        source:
          type: string
          enum:
            - jlu_iedu
            - chaoxing
            - jlu_oa
            - jlu_ilearn
        status:
          type: string
          enum:
            - connected
            - auth_required
            - disconnected
        last_success_at:
          type: string
          format: date-time
          nullable: true
          description: Null before the first successful sync.
    ActivateRequest:
      type: object
      additionalProperties: false
      required:
        - invite_token
        - password
      properties:
        invite_token:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            One-time invitation token supplied by the operator, prefixed
            `inv_`. It is not a session token and clients must not log it.
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            New password, measured in Unicode code points. There is no
            character-class requirement, but it must differ from the
            invitation's login. The client and the server never log it.

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 4
          maxLength: 64
          pattern: '^[a-z0-9._-]+$'
          description: |
            Workbench login. The server trims surrounding whitespace and
            lowercases the value before validating it against the 4-64
            `[a-z0-9._-]` rule.
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: The current password. A wrong value is 401, not 422.

    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
          description: Opaque refresh token from the most recent token pair.

    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
          description: Refresh token of the session that the bearer token belongs to.

    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          minLength: 1
          description: Opaque access token. Expires after `expires_in` seconds.
        refresh_token:
          type: string
          minLength: 1
          description: Opaque refresh token. Rotates on every refresh; the previous value is rejected.
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.

    TokenPairResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/TokenPair'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    Me:
      type: object
      required:
        - id
        - display_name
        - timezone
      properties:
        id:
          type: string
          format: uuid
          description: Workbench user id derived from the server-side session.
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        timezone:
          type: string
          description: IANA timezone used for campus display dates. Campus dates remain Asia/Shanghai in this contract.

    MeResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/Me'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'
    CreateSyncJobRequest:
      type: object
      additionalProperties: false
      required:
        - source
        - resource
        - scope
      properties:
        source:
          type: string
          pattern: '^[a-z0-9_]{1,64}$'
          example: jlu_iedu
        resource:
          type: string
          pattern: '^[a-z0-9_]{1,64}$'
          example: schedule
        scope:
          type: object
          additionalProperties: true
          description: |
            Source-defined cache dataset. At most 4096 bytes when serialized.
            It must identify a snapshot (for example a semester id), not a
            client query window; do not put from/to paging values here.

    SyncJobStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed

    SyncJob:
      type: object
      required:
        - id
        - source
        - resource
        - scope
        - status
        - attempts
        - created_at
        - started_at
        - finished_at
        - updated_at
        - error
        - complete
        - snapshot_version
      properties:
        id:
          type: string
          description: Opaque job id. Clients only compare it for equality.
        source:
          type: string
        resource:
          type: string
        scope:
          type: object
          additionalProperties: true
          description: Canonical scope echoed from the request.
        status:
          $ref: '#/components/schemas/SyncJobStatus'
        attempts:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
        error:
          type: object
          nullable: true
          required:
            - code
            - retryable
          properties:
            code:
              type: string
              description: Stable source or worker error code. Never upstream error text.
            retryable:
              type: boolean
        complete:
          type: boolean
          nullable: true
          description: Whether the adapter committed a complete snapshot. Null until the job succeeds.
        snapshot_version:
          type: integer
          format: int64
          nullable: true
          description: Opaque version reported by the adapter. Clients only compare it for equality.

    SyncJobAccepted:
      allOf:
        - $ref: '#/components/schemas/SyncJob'
        - type: object
          required:
            - reused
          properties:
            reused:
              type: boolean
              description: True when an active job already existed for this user, source, resource and scope.

    SyncJobResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/SyncJob'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'

    SyncJobAcceptedResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/SyncJobAccepted'
        meta:
          $ref: '#/components/schemas/RequestIdMeta'
