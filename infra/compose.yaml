name: jlu-dela

x-api-image: &api-image
  build:
    context: ../server
    args:
      GIT_COMMIT: ${GIT_COMMIT:-local}
  image: ${API_IMAGE:-jlu-dela-api:local}

x-api-environment: &api-environment
  HTTP_HOST: 0.0.0.0
  HTTP_PORT: "8080"
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
  DATABASE_ACQUIRE_TIMEOUT_SECONDS: "5"
  REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-15}
  MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  APP_BUILD_ID: ${APP_BUILD_ID:-local}
  LOG_FORMAT: json
  RUST_LOG: ${RUST_LOG:-info,sqlx=warn}

services:
  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7.4.12-alpine3.22
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - internal

  migrate:
    <<: *api-image
    restart: "no"
    environment:
      <<: *api-environment
    command:
      - /usr/local/bin/migrate
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    <<: *api-image
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - edge

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    ports:
      - "127.0.0.1:${CADDY_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/health/live
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - edge

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  edge:
