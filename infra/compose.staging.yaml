services:
  api:
    image: ${API_IMAGE:?set API_IMAGE to an immutable image digest or tag}
    build: !reset null
    environment:
      APP_BUILD_ID: ${APP_BUILD_ID:?set APP_BUILD_ID to the deployed commit}

  migrate:
    image: ${API_IMAGE:?set API_IMAGE to an immutable image digest or tag}
    build: !reset null
    environment:
      APP_BUILD_ID: ${APP_BUILD_ID:?set APP_BUILD_ID to the deployed commit}

  caddy:
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to the staging DNS name}
    ports: !override
      - "80:80"
      - "443:443"
